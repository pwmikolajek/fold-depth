<meta charset="utf-8">
<title>Fold Depth</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   FOLD DEPTH — the defocus that resolves as a foldable opens flat.

   The blur is not a property of the open display. It belongs to the
   hinge. Each half is tilted out of the focal plane by

       φ = 90° − θ/2               θ = the angle between the halves

   so a point x from the hinge sits at depth x·sin(φ), and its circle of
   confusion grows with that depth. One angle, one factor:

       σ ∝ sin(φ)                  ( = cos(θ/2) )

   and sin(φ) is doing double duty — it is both how far the surface has
   travelled off the focal plane and how much that costs in sharpness.
   At θ=180° it is exactly 0 and the display is bit-for-bit sharp.

   The halves really rotate: two leaves under one `perspective`, hinged
   on their inner edges, with the book pulled back by 25em·sin(φ) so the
   fold pivots about its own centre of mass instead of lunging forward.
   Both leaves are stamped from one <template>, so the veil table below
   is written once.

   The spatial shape of the blur still has to be assembled, because a
   Gaussian blur has exactly one radius — there is no `blur(0px 40px)`,
   and masking a single blurred copy only cross-fades between two fixed
   radii. So six `backdrop-filter` veils are stacked over each half;
   each blurs ~1.8× harder than the one beneath it and each is masked to
   *begin* further out. Every veil filters the accumulated backdrop
   below it, so the radii compound in quadrature (σ = √Σσᵢ²) and the
   ramp is continuous.

   Two numbers describe a veil, both measured outward from the hinge as
   a percentage of the display width:

       --A   how far the untouched core reaches from the hinge
       --B   where this veil reaches full strength
       --r   its blur radius in em — and 1em is 1% of the display
             width, so the whole effect scales with the panel

   One field function (--field) turns A and B into a mask: a linear
   gradient bends the surface like a cylinder, a radial one like a dome.
   Everything past the EFFECT block is demo chrome.
   ══════════════════════════════════════════════════════════════════════ */

@property --hinge  { syntax: "<angle>";  inherits: true; initial-value: 180deg }
@property --phi    { syntax: "<angle>";  inherits: true; initial-value: 0deg }
@property --depth  { syntax: "<number>"; inherits: true; initial-value: 0 }
@property --spread { syntax: "<number>"; inherits: true; initial-value: 1 }

/* ─── EFFECT ─────────────────────────────────────────────────────────── */

.stage {
  /* the hinge is the only input; should a browser lack trigonometry,
     --depth falls back to 0 and the display is simply sharp */
  --phi: calc(90deg - var(--hinge) / 2);
  --depth: sin(var(--phi));
}

.book {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  /* keep the fold centred in z rather than swinging at the viewer */
  transform: translateZ(calc(-25em * sin(var(--phi))));
}

.leaf {
  position: absolute;
  inset-block: 0;
  width: 50%;
  /* the outer edge of each half swings toward the viewer: the display
     is on the inside of the fold, so the surface is concave */
  --lit: calc(.72 * cos(var(--phi)));
  --grip: max(34px, 5em);          /* a rim you can actually grab */

  /* This filter is load-bearing twice over. Inside a 3D rendering
     context Chrome drops the veils masks and blurs the whole half; a
     filter flattens the leaf into its own render surface, so its
     interior composites as plain 2D and the masks are honoured again.
     It also carries the key light, so the fix pays for itself. */
  filter: brightness(calc(.62 + .38 * var(--lit) / .72));
}
[data-side="l"] { left: 0;   transform-origin: 100% 50%; transform: rotateY(var(--phi));
                  --lit: calc(.72 * cos(var(--phi)) - .48 * sin(var(--phi))) }
[data-side="r"] { left: 50%; transform-origin: 0 50%;    transform: rotateY(calc(-1 * var(--phi)));
                  --lit: calc(.72 * cos(var(--phi)) + .48 * sin(var(--phi))) }

.crop {                               /* a plain rectangular clip */
  position: absolute;
  inset: 0;
  overflow: hidden;
  user-select: none;
}

.face {
  position: absolute;
  inset-block: 0;
  overflow: hidden;
  /* A uniform radius, deliberately. Chrome drops a veils mask when the
     container it sits in is clipped to an *asymmetric* rounded rect, so
     rather than rounding three corners here, the face is extended one
     radius past the hinge and .crop shears that side off square. */
  border-radius: var(--R);
}
[data-side="l"] .face { left: 0;  right: calc(-1 * var(--R)) }
[data-side="r"] .face { right: 0; left:  calc(-1 * var(--R)) }

.plate {                              /* the full display, cropped by the half */
  position: absolute;
  inset-block: 0;
  width: 200%;
}
[data-side="l"] .plate { left: 0 }
[data-side="r"] .plate { left: -100% }

.veil {
  position: absolute;
  inset: 0;
  pointer-events: none;

  /* --spread widens or tightens the ramp without touching the table */
  --a: calc(var(--A) * var(--spread));
  --b: calc(var(--B) * var(--spread));

  /* out-of-focus glass also loses saturation and picks up haze, so the
     heavy veils carry --extra and --haze. Optics, not decoration. */
  background: rgb(226 236 252 / calc(var(--haze, 0) * var(--depth)));
  -webkit-backdrop-filter: blur(calc(var(--r) * var(--depth))) var(--extra, saturate(1));
          backdrop-filter: blur(calc(var(--r) * var(--depth))) var(--extra, saturate(1));
  -webkit-mask-image: var(--field);
          mask-image: var(--field);
}

/* cylinder: the surface bends about the hinge, so σ varies only in x.
   A and B are read as a share of the display, the mask spans a half,
   hence the ×2. */
[data-side="l"] .veil { --field: linear-gradient(to left,  #0000 calc(var(--a) + var(--R)), #000 calc(var(--b) + var(--R))) }
[data-side="r"] .veil { --field: linear-gradient(to right, #0000 calc(var(--a) + var(--R)), #000 calc(var(--b) + var(--R))) }

/* dome: same table, ellipsoidal field centred on the hinge */
.stage:has(#dome:checked) [data-side="l"] .veil {
  --field: radial-gradient(50em 88% at calc(100% - var(--R)) 50%, #0000 var(--a), #000 var(--b)) }
.stage:has(#dome:checked) [data-side="r"] .veil {
  --field: radial-gradient(50em 88% at var(--R) 50%, #0000 var(--a), #000 var(--b)) }

/* Firefox < 103 and friends: keep the falloff, lose the blur */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .veil { background: rgb(7 10 16 / calc(.14 * var(--depth))) }
}

/* ─── PAGE ───────────────────────────────────────────────────────────── */

:root {
  /* one committed visual world — a dark stage — so no theme swap, but
     every colour is painted explicitly rather than inherited */
  color-scheme: dark;
  --void: #06080c;
  --ink: #eef2f8;
  --mute: #8e9cb2;
  --line: rgb(150 168 196 / .15);
  --focus: #f0b25c;          /* golden hour, sampled from the wallpaper */

  /* the open display, sized to what the chrome leaves behind */
  --w: min(86vw, max(260px, min(calc((100svh - 390px) * 1.25), 1040px)));
}

* { box-sizing: border-box }

body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: Archivo, "Helvetica Neue", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* the photo, thrown far out of focus — the world the display looks into */
.amb, .vig { position: fixed; inset: 0; pointer-events: none }
.amb {
  background: var(--photo) center / cover no-repeat;
  filter: blur(40px) saturate(1.3) brightness(.44);
  transform: scale(1.07);
}
.vig {
  background:
    radial-gradient(122% 92% at 50% 44%, #0000 26%, rgb(4 6 11 / .74) 100%),
    linear-gradient(rgb(4 6 11 / .6), #0000 26%, rgb(4 6 11 / .55));
}

.stage {
  position: relative;
  min-height: 100svh;
  display: grid;
  grid-template-rows: 1fr;
  justify-items: center;
  padding-inline: 16px;
  padding-block: clamp(20px, 4svh, 48px);
}

.rig {
  margin-block: auto;
  width: var(--w);
  display: flex;
  flex-direction: column;
  gap: clamp(16px, 2.6svh, 30px);
}

/* ─── header ─────────────────────────────────────────────────────────── */

.head {
  display: grid;
  grid-template-columns: auto minmax(0, 46ch);
  align-items: end;
  justify-content: space-between;
  gap: 8px 32px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0;
  font-size: clamp(30px, 4.2vw, 50px);
  font-weight: 600;
  font-stretch: 86%;
  letter-spacing: -.028em;
  line-height: .95;
  color: #fbfcfe;
}
.head p {
  margin: 0;
  color: var(--mute);
  font-size: clamp(12.5px, 1.05vw, 14px);
  line-height: 1.55;
  text-wrap: pretty;
}
.head code, .head b {
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: .93em;
  font-weight: 400;
  color: #c3cede;
}

/* ─── device ─────────────────────────────────────────────────────────── */

.hero { padding-block: 2.5% }          /* room for the fold to bulge into */

.device {
  position: relative;
  width: 100%;
  aspect-ratio: 1.34;
  font-size: calc(var(--w) / 100);     /* 1em == 1% of the display width */
  perspective: 300em;
  --R: 3.4em;
}

.metal {                               /* titanium, one band across both halves */
  position: absolute;
  inset: -.9em;
  background: conic-gradient(from 202deg,
    #61666e, #d9dee5 11%, #878e97 25%, #f4f7fa 37%,
    #767d86 51%, #ccd3da 65%, #666c74 79%, #e7ebf0 91%, #61666e);
  background-size: 200% 100%;
  box-shadow:
    0 3.4em 7em -2em rgb(0 0 0 / .8),
    0 .8em 2em -.8em rgb(0 0 0 / .55);
}
[data-side="l"] .metal { right: 0; background-position: 0 0;
  border-radius: calc(var(--R) + .9em) 0 0 calc(var(--R) + .9em) }
[data-side="r"] .metal { left: 0; background-position: 100% 0;
  border-radius: 0 calc(var(--R) + .9em) calc(var(--R) + .9em) 0 }

.gasket {                              /* the dark line where glass meets metal */
  position: absolute;
  inset: -.12em;
  background: #04060a;
}
[data-side="l"] .gasket { right: 0; border-radius: calc(var(--R) + .12em) 0 0 calc(var(--R) + .12em) }
[data-side="r"] .gasket { left: 0; border-radius: 0 calc(var(--R) + .12em) calc(var(--R) + .12em) 0 }

.wall {                                /* a display is emissive - lift it
                                          out of the dim room behind it */
  position: absolute;
  inset: 0;
  background: var(--photo) 50% 34% / cover no-repeat;
  filter: brightness(1.15) saturate(1.08) contrast(1.02);
}

.crease {                              /* on the display, so it folds with it */
  position: absolute;
  inset-block: 0;
  width: 5em;
  pointer-events: none;
  opacity: calc(var(--depth) * 1.25);   /* gone by the time it lies flat */
}
[data-side="l"] .crease { right: 0;
  background: linear-gradient(to right, #0000, rgb(4 7 12 / .34) 78%, rgb(255 255 255 / .16)) }
[data-side="r"] .crease { left: 0;
  background: linear-gradient(to left, #0000, rgb(4 7 12 / .3) 78%, rgb(4 7 12 / .16)) }

.gloss {                               /* front surface of the glass */
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 88% at 16% -12%, rgb(255 255 255 / .15), #0000 46%),
    radial-gradient(92% 70% at 94% 110%, rgb(255 255 255 / .07), #0000 52%);
  background-size: 200% 100%;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .2);
}
[data-side="l"] .gloss { background-position: 0 0 }
[data-side="r"] .gloss { background-position: 100% 0 }

/* ─── screen contents (SF, because it is a phone screen) ─────────────── */

.screen {
  position: absolute;
  inset: 0;
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  color: #fff;
  letter-spacing: -.01em;
}
.status {
  position: absolute;
  top: 3.2em; left: 6em; right: 6em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 3.1em;
  font-weight: 590;
  text-shadow: 0 .04em .12em rgb(0 0 0 / .3);
}
.status .sys { display: flex; align-items: center; gap: .5em }
.status svg { height: .78em; width: auto; display: block }

.cards {
  position: absolute;
  top: 15em; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 3.4em;
}
.card {
  width: 25em;
  aspect-ratio: 1;
  padding: 2.6em;
  border-radius: 5.6em;
  display: flex;
  flex-direction: column;
  background: rgb(22 29 41 / .3);
  text-shadow: 0 .03em .12em rgb(0 0 0 / .3);
  -webkit-backdrop-filter: blur(2em) saturate(1.7);
          backdrop-filter: blur(2em) saturate(1.7);
  box-shadow: inset 0 .1em 0 rgb(255 255 255 / .28), 0 1em 2.4em -.8em rgb(0 0 0 / .35);
}
.card .k { font-size: 2.5em; font-weight: 600; opacity: .92 }
.card .n { font-size: 7.4em; font-weight: 300; line-height: 1; letter-spacing: -.045em; margin-top: .06em }
.card .s { font-size: 2.1em; font-weight: 500; opacity: .78; margin-top: auto; line-height: 1.25 }
.card .arc { margin-top: auto; width: 100%; height: auto; display: block }

.dock {
  position: absolute;
  bottom: 4.4em; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 2.2em;
  padding: 1.8em 2em;
  border-radius: 6.4em;
  background: rgb(22 29 41 / .26);
  -webkit-backdrop-filter: blur(1.6em) saturate(1.6);
          backdrop-filter: blur(1.6em) saturate(1.6);
  box-shadow: inset 0 .1em 0 rgb(255 255 255 / .24);
}
.app {
  width: 8.4em; height: 8.4em;
  border-radius: 2.3em;
  display: grid;
  place-items: center;
  box-shadow: inset 0 .12em 0 rgb(255 255 255 / .32), 0 .5em 1.2em -.3em rgb(0 0 0 / .45);
}
.app svg { width: 62%; height: 62%; fill: none; stroke: #fff; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round }

/* ─── σ ramp: the effect, plotted ────────────────────────────────────── */

.ramp { margin: 0; display: flex; flex-direction: column; gap: 7px }
.ramp-top, .ramp-axis {
  display: flex;
  justify-content: space-between;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--mute);
}
.ramp-top .v { color: var(--focus); font-variant-numeric: tabular-nums }
.ramp-axis span:nth-child(2) { color: #c3cede }
.plot { display: block; width: 100%; height: 34px; overflow: visible }
.plot .grid  { stroke: var(--line); stroke-width: 1 }
.plot .hinge { stroke: rgb(195 206 222 / .5); stroke-width: 1; stroke-dasharray: 2 3 }
.plot .env   { fill: none; stroke: rgb(240 178 92 / .3); stroke-width: 1; stroke-dasharray: 3 3 }
.plot .area  { fill: rgb(240 178 92 / .13) }
.plot .line  { fill: none; stroke: var(--focus); stroke-width: 1.6; stroke-linejoin: round }

/* ─── instrument rail ────────────────────────────────────────────────── */

.rail {
  width: min(86vw, max(100%, 600px));
  align-self: center;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 22px;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgb(12 17 24 / .58);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
          backdrop-filter: blur(22px) saturate(1.3);
}
.rail k, .seg, .ghost, output {
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.rail k { color: var(--mute) }
.knob { display: flex; align-items: center; gap: 10px }
.knob output { color: var(--focus); min-width: 3.6em; font-variant-numeric: tabular-nums }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: clamp(84px, 10vw, 130px);
  height: 14px;
  margin: 0;
  background: none;
  cursor: ew-resize;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--focus) var(--fill, 50%), rgb(150 168 196 / .26) var(--fill, 50%));
}
input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: rgb(150 168 196 / .26) }
input[type=range]::-moz-range-progress { height: 2px; border-radius: 2px; background: var(--focus) }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; margin-top: -5px;
  border-radius: 50%; border: 0;
  background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / .35), 0 2px 6px rgb(0 0 0 / .5);
}
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / .35), 0 2px 6px rgb(0 0 0 / .5);
}
input[type=range]:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 3px }

.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden }
.seg input { position: absolute; opacity: 0; pointer-events: none }
.seg label { padding: 5px 11px 4px; color: var(--mute); cursor: pointer; transition: color .18s, background .18s }
.seg label + input + label { border-left: 1px solid var(--line) }
.seg input:checked + label { background: rgb(240 178 92 / .14); color: var(--focus) }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: -2px }

.ghost {
  margin-left: auto;
  padding: 6px 13px 5px;
  border: 1px solid rgb(240 178 92 / .35);
  border-radius: 9px;
  background: rgb(240 178 92 / .08);
  color: var(--focus);
  cursor: pointer;
  transition: background .18s, border-color .18s;
}
.ghost:hover { background: rgb(240 178 92 / .16); border-color: rgb(240 178 92 / .55) }
.ghost:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }

/* the display is sized from the viewport height, so the header follows it */
@media (max-height: 870px) {
  .head { grid-template-columns: 1fr }
}

@media (max-width: 640px) {
  :root { --w: min(86vw, max(240px, calc((100svh - 420px) * 1.25))) }
  .head { grid-template-columns: 1fr }
  .ghost { margin-left: 0 }
}

/* ─── edge grips: hold the rim and drag up or down to work the hinge ──── */

.grip {
  position: absolute;
  top: 24%; height: 52%;
  width: var(--grip);
  cursor: ns-resize;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
[data-side="l"] .grip { left:  calc(var(--grip) / -2) }
[data-side="r"] .grip { right: calc(var(--grip) / -2) }
.grip::before {                        /* knurling, so the rim reads as a handle */
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 1.05em;
  height: 54%;
  border-radius: 1em;
  background: repeating-linear-gradient(rgb(10 14 20 / .6) 0 .16em, #0000 .16em .46em);
  opacity: .4;
  transition: opacity .18s;
}
.grip:hover::before { opacity: .95 }
body.folding, body.folding .grip { cursor: ns-resize }
body.folding { user-select: none }

/* ─── the snippet this state generates ───────────────────────────────── */

.sheet {
  position: relative;
  display: grid;
  justify-items: center;
  padding: 0 16px clamp(30px, 6svh, 70px);
}
.wide { width: min(86vw, max(var(--w), 620px)) }

.snip-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 20px;
  margin-bottom: 10px;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--mute);
}
.snip {
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgb(9 13 19 / .66);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
          backdrop-filter: blur(22px) saturate(1.3);
  overflow-x: auto;
}
.snip code {
  display: block;
  padding: 16px 18px;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 11.5px;
  line-height: 1.62;
  color: #ccd5e3;
  white-space: pre;
}
.snip i { font-style: normal }
.snip .c { color: rgb(142 156 178 / .7) }      /* comments */
.snip .v { color: var(--focus) }               /* whatever the controls drive */

.foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 20px;
  margin-top: 15px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: rgb(142 156 178 / .82);
}
.foot a { color: rgb(192 204 222 / .92); text-decoration: none;
  border-bottom: 1px solid rgb(150 168 196 / .3) }
.foot a:hover { color: var(--ink); border-bottom-color: var(--focus) }
.foot a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px }
</style>

<div class="amb"></div>
<div class="vig"></div>

<!-- both halves are stamped from this, so the veil table is written once -->
<template id="half">
  <div class="metal"></div>
  <div class="gasket"></div>

  <div class="crop">
  <div class="face">
    <div class="plate">
      <div class="wall"></div>

      <div class="screen" aria-hidden="true">
        <div class="status">
          <span>9:41</span>
          <span class="sys">
            <svg viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
              <path d="M2.2 6.1a13 13 0 0 1 17.6 0"/><path d="M5.6 9.6a8.2 8.2 0 0 1 10.8 0"/><path d="M9 13.1a3.4 3.4 0 0 1 4 0"/>
            </svg>
            <svg viewBox="0 0 30 14">

<main class="stage">
  <div class="rig">

    <header class="head">
      <h1>Fold Depth</h1>
      <p>The blur belongs to the hinge, not the display: each half is tilted <b>φ = 90° − θ/2</b> out of the focal plane, so defocus follows <b>sin(φ)</b> and reaches zero flat. Six masked <code>backdrop-filter</code> veils carry the ramp.</p>
    </header>

    <div class="hero">
      <div class="device" id="device">
        <div class="book">

        <line class="grid" x1="0" y1="27.5" x2="100" y2="27.5" vector-effect="non-scaling-stroke"/>
        <path class="env" id="env" d="" vector-effect="non-scaling-stroke"/>
        <path class="area" id="area" d=""/>

        <line class="hinge" x1="50" y1="0" x2="50" y2="28" vector-effect="non-scaling-stroke"/>
      </svg>

      <label class="knob"><k>Hinge</k><input id="hinge" type="range" min="30" max="180" step="1" value="90"><output for="hinge" id="hingeOut">90°</output></label>
      <label class="knob"><k>Core</k><input id="spread" type="range" min=".5" max="1.15" step=".01" value="1"><output for="spread" id="spreadOut">16%</output></label>

          <input type="radio" name="field" id="dome"><label for="dome">Dome</label>

<script>
const stage = document.querySelector('.stage');
const device = document.getElementById('device');
const hinge = document.getElementById('hinge');
const spread = document.getElementById('spread');
const toggle = document.getElementById('toggle');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// stamp both leaves from the one template
const half = document.getElementById('half');
for (const leaf of document.querySelectorAll('.leaf')) leaf.append(half.content.cloneNode(true));

// read the veil table straight off the DOM — the markup stays the source of truth
const VEILS = [...document.querySelector('.face').querySelectorAll('.veil')].map(v => ({
  r: parseFloat(v.style.getPropertyValue('--r')),
  A: parseFloat(v.style.getPropertyValue('--A')),
  B: parseFloat(v.style.getPropertyValue('--B')),
}));
const BASE = Math.hypot(...VEILS.map(v => v.r));   // σ at the edge, closed, in em
const SHUT = +hinge.min;

// the whole model: defocus scales with sin(φ), and φ = 90° − θ/2
const defocus = deg => Math.sin((90 - deg / 2) * Math.PI / 180);

// σ(u): u = distance from the hinge, % of display width
function sigma(u, s, d) {
  let q = 0;
  for (const v of VEILS) {
    const a = v.A * s, b = v.B * s;
    const t = Math.min(1, Math.max(0, (u - a) / (b - a)));
    q += (t * v.r * d) ** 2;
  }
  return Math.sqrt(q);
}

function curve(s, d, em, ceiling) {
  const pts = [];
  let hi = 0;
  for (let i = 0; i <= 140; i++) {
    const x = i / 140 * 100;
    const sg = sigma(Math.abs(x - 50), s, d) * em;
    if (sg > hi) hi = sg;
    pts.push(x.toFixed(2) + ' ' + (27.5 - 27.5 * Math.min(1, sg / ceiling)).toFixed(2));
  }
  return { d: 'M' + pts.join('L'), fill: 'M0 27.5L' + pts.join('L') + 'L100 27.5Z', hi };
}

function paint() {
  const deg = +hinge.value, s = +spread.value, d = defocus(deg);
  const em = parseFloat(getComputedStyle(device).fontSize);
  const ceiling = BASE * em;                       // axis top = σ fully closed

  stage.style.setProperty('--hinge', deg + 'deg');
  stage.style.setProperty('--spread', s);
  hinge.style.setProperty('--fill', ((deg - SHUT) / (180 - SHUT) * 100) + '%');
  spread.style.setProperty('--fill', ((s - .5) / .65 * 100) + '%');
  hingeOut.value = Math.round(deg) + '°';
  spreadOut.value = Math.round(2 * VEILS[0].A * s) + '%';   // the untouched core

  const live = curve(s, d, em, ceiling);
  line.setAttribute('d', live.d);
  area.setAttribute('d', live.fill);
  env.setAttribute('d', curve(s, defocus(SHUT), em, ceiling).d);   // the envelope
  peak.textContent = '0 → ' + live.hi.toFixed(1) + ' px';
  toggle.textContent = deg > 178 ? 'Fold' : 'Open flat';
  snap();
}

hinge.addEventListener('input', paint);
spread.addEventListener('input', paint);
addEventListener('resize', paint);
document.querySelectorAll('input[name=field]').forEach(el => el.addEventListener('change', paint));

// swing the hinge over time — the blur resolves as the halves flatten
let raf = 0;
function swing(to, ms) {
  cancelAnimationFrame(raf);
  if (reduced) { hinge.value = to; paint(); return; }
  const from = +hinge.value, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    hinge.value = from + (to - from) * (1 - Math.pow(1 - p, 3));
    paint();
    if (p < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

toggle.addEventListener('click', () => swing(+hinge.value > 178 ? 58 : 180, 1250));


/* ── hold the rim, drag vertically: down folds, up opens flat ───────── */

for (const grip of document.querySelectorAll('.grip')) {
  grip.addEventListener('pointerdown', e => {
    cancelAnimationFrame(raf);                 // a drag beats any running swing
    grip.setPointerCapture(e.pointerId);
    document.body.classList.add('folding');
    const y0 = e.clientY, h0 = +hinge.value;
    const perDeg = device.getBoundingClientRect().height * .95 / (180 - SHUT);

    const move = ev => {
      const next = h0 - (ev.clientY - y0) / perDeg;
      hinge.value = Math.min(180, Math.max(SHUT, next));
      paint();
    };
    const up = () => {
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', up);
      grip.removeEventListener('pointercancel', up);
      document.body.classList.remove('folding');
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
    e.preventDefault();
  });
}

/* ── the snippet, regenerated on every change ───────────────────────── */

const codeEl = document.getElementById('snip');
const LIVE = /«([^»]*)»/g;      // marks whatever the controls drive
const lit = x => '«' + x + '»';
let snippetText = '';

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

function snap() {
  const deg = Math.round(+hinge.value), s = +spread.value;
  const dome = document.getElementById('dome').checked;
  const phi = 90 - deg / 2;
  const d = defocus(deg);
  const em = parseFloat(getComputedStyle(device).fontSize);

  const field = dome
    ? 'radial-gradient(50em 88% at calc(100% - var(--R)) 50%, #0000 var(--a), #000 var(--b))'
    : 'linear-gradient(to left, #0000 calc(var(--a) + var(--R)), #000 calc(var(--b) + var(--R)))';

  const table = VEILS.map((v, i) =>
    `.veil:nth-of-type(${i + 1}) { --r: ${v.r.toFixed(2)}em; --a: ${lit((v.A * s).toFixed(1) + 'em')}; --b: ${lit((v.B * s).toFixed(1) + 'em')} }`
  ).join('\n');

  snippetText = [
    `/* fold depth · hinge ${lit(deg + '°')} · ${lit(dome ? 'dome' : 'cylinder')} field`,
    ` * σ 0 → ${lit((sigma(50, s, d) * em).toFixed(1) + 'px')} at the outer edge */`,
    ``,
    `@property --hinge { syntax: "<angle>";  inherits: true; initial-value: 180deg }`,
    `@property --phi   { syntax: "<angle>";  inherits: true; initial-value: 0deg   }`,
    `@property --depth { syntax: "<number>"; inherits: true; initial-value: 0      }`,
    ``,
    `.book {                          /* 1em == 1% of the display width */`,
    `  --hinge: ${lit(deg + 'deg')};                 /* the only input */`,
    `  --phi:   calc(90deg - var(--hinge) / 2);   /* ${lit(phi.toFixed(1) + 'deg')} of tilt per half */`,
    `  --depth: sin(var(--phi));                  /* ${lit(d.toFixed(4))} */`,
    ``,
    `  transform-style: preserve-3d;`,
    `  transform: translateZ(calc(-25em * sin(var(--phi))));`,
    `}`,
    ``,
    `.leaf[data-side="l"] { transform-origin: 100% 50%; transform: rotateY(var(--phi))            }`,
    `.leaf[data-side="r"] { transform-origin: 0    50%; transform: rotateY(calc(-1 * var(--phi))) }`,
    ``,
    `/* a filter flattens each leaf into its own render surface - without`,
    ` * one, Chrome drops the veil masks inside a 3D context. It carries`,
    ` * the key light too, so it is not merely a workaround. */`,
    `.leaf { filter: brightness(calc(.62 + .38 * var(--lit) / .72)) }`,
    ``,
    `/* Each half keeps a UNIFORM border-radius and overhangs the hinge by`,
    ` * --R, cropped square by a plain rect clip: Chrome drops a veils`,
    ` * mask when its container is clipped to an asymmetric rounded`,
    ` * rect, which is what a three-cornered half would need. */`,
    ``,
    `.veil {                          /* six per half, hinge side first */`,
    `  position: absolute;`,
    `  inset: 0;`,
    `  backdrop-filter: blur(calc(var(--r) * var(--depth)));`,
    `  mask-image: ${lit(field)};`,
    `}`,
    ``,
    table,
    ``,
    `/* the right half mirrors the mask: ${lit(dome ? 'at 0 50%' : 'to right')} */`,
  ].join('\n');

  codeEl.innerHTML = esc(snippetText)
    .replace(LIVE, '<i class="v">$1</i>')
    .replace(/\/\*[\s\S]*?\*\//g, m => '<i class="c">' + m + '</i>');

  snippetText = snippetText.replace(/[«»]/g, '');
}

const copyBtn = document.getElementById('copy');
copyBtn.addEventListener('click', async () => {
  const say = t => { copyBtn.textContent = t; setTimeout(() => copyBtn.textContent = 'Copy', 1600) };
  try {
    await navigator.clipboard.writeText(snippetText);
    say('Copied');
  } catch {
    const r = document.createRange();
    r.selectNodeContents(codeEl);
    getSelection().removeAllRanges();
    getSelection().addRange(r);
    say('Select and copy');
  }
});

/* ── boot: start folded, then swing open to the resting angle ────── */

hinge.value = 42;
paint();
addEventListener("load", () => { hinge.value = 42; swing(90, 1500) });
